<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Num-Pad Ziffern-Trainer</title>
<style>
  :root {
    --bg-primary: #ffffff;
    --bg-secondary: #f5f4ef;
    --bg-info: #E6F1FB;
    --text-primary: #1a1a1a;
    --text-secondary: #6b6a64;
    --text-info: #0C447C;
    --border-tertiary: rgba(0,0,0,0.15);
    --border-info: #378ADD;
    --radius-md: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-primary: #1a1a1a;
      --bg-secondary: #262626;
      --bg-info: #042C53;
      --text-primary: #f0f0f0;
      --text-secondary: #a0a0a0;
      --text-info: #B5D4F4;
      --border-tertiary: rgba(255,255,255,0.15);
      --border-info: #378ADD;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem 1rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
  }
  .container {
    max-width: 620px;
    margin: 0 auto;
  }
  h1 {
    font-size: 20px;
    font-weight: 500;
    margin: 0 0 1.5rem;
    text-align: center;
    color: var(--text-secondary);
  }
  #display {
    font-size: 220px;
    font-weight: 500;
    text-align: center;
    min-height: 260px;
    line-height: 260px;
    font-variant-numeric: tabular-nums;
    letter-spacing: -6px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
  }
  .label {
    font-size: 14px;
    color: var(--text-secondary);
    min-width: 130px;
  }
  .value {
    font-size: 14px;
    font-weight: 500;
    min-width: 50px;
    text-align: right;
  }
  input[type="range"] {
    flex: 1;
    height: 4px;
    -webkit-appearance: none;
    appearance: none;
    background: var(--border-tertiary);
    border-radius: 2px;
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--text-primary);
    cursor: pointer;
  }
  input[type="range"]::-moz-range-thumb {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--text-primary);
    cursor: pointer;
    border: none;
  }
  input[type="checkbox"] {
    width: 16px;
    height: 16px;
    cursor: pointer;
  }
  .checkbox-label {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    font-size: 14px;
  }
  #digits {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    flex: 1;
  }
  .chip {
    width: 38px;
    height: 38px;
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 16px;
    font-weight: 500;
    user-select: none;
    transition: background 0.1s;
  }
  .chip.off {
    background: var(--bg-primary);
    color: var(--text-secondary);
    border: 0.5px solid var(--border-tertiary);
  }
  .chip.on {
    background: var(--bg-info);
    color: var(--text-info);
    border: 0.5px solid var(--border-info);
  }
  button {
    padding: 12px 20px;
    font-size: 15px;
    font-weight: 500;
    background: var(--bg-primary);
    color: var(--text-primary);
    border: 0.5px solid var(--border-tertiary);
    border-radius: var(--radius-md);
    cursor: pointer;
    font-family: inherit;
  }
  button:hover { background: var(--bg-secondary); }
  button:active { transform: scale(0.98); }
  #toggle { flex: 1; }
  .btn-row { display: flex; gap: 8px; margin-top: 8px; }
  .hint {
    margin-top: 2rem;
    font-size: 12px;
    color: var(--text-secondary);
    text-align: center;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>Num-Pad Ziffern-Trainer</h1>

    <div id="display">–</div>

    <div class="row">
      <span class="label">Intervall</span>
      <input type="range" id="intv" min="500" max="5000" step="100" value="2000">
      <span class="value" id="intv-out">2.0 s</span>
    </div>

    <div class="row">
      <span class="label">Sprechtempo</span>
      <input type="range" id="rate" min="0.5" max="1.3" step="0.05" value="0.85">
      <span class="value" id="rate-out">0.85×</span>
    </div>

    <div class="row">
      <span class="label">Audio</span>
      <label class="checkbox-label">
        <input type="checkbox" id="audio-on" checked>
        Zahl aussprechen (Deutsch)
      </label>
    </div>

    <div class="row" style="align-items: flex-start;">
      <span class="label" style="padding-top: 8px;">Ziffern</span>
      <div id="digits"></div>
    </div>

    <div class="btn-row">
      <button id="toggle">Start</button>
      <button id="step">Nächste</button>
    </div>

    <p class="hint">Tipp: Im Vollbildmodus üben (F11). Stimme wird vom Betriebssystem bereitgestellt.</p>
  </div>

<script>
  const words = ['null','eins','zwei','drei','vier','fünf','sechs','sieben','acht','neun'];
  const defaultActive = [0,1,2,3,4,5,6,8,9];
  const active = new Set(defaultActive);

  const digitsEl = document.getElementById('digits');
  for (let i = 0; i <= 9; i++) {
    const chip = document.createElement('div');
    chip.textContent = i;
    chip.className = 'chip ' + (active.has(i) ? 'on' : 'off');
    chip.onclick = () => {
      if (active.has(i)) { active.delete(i); chip.className = 'chip off'; }
      else { active.add(i); chip.className = 'chip on'; }
    };
    digitsEl.appendChild(chip);
  }

  const intv = document.getElementById('intv');
  const intvOut = document.getElementById('intv-out');
  const rate = document.getElementById('rate');
  const rateOut = document.getElementById('rate-out');
  const audioOn = document.getElementById('audio-on');
  const toggleBtn = document.getElementById('toggle');
  const stepBtn = document.getElementById('step');
  const display = document.getElementById('display');

  intv.addEventListener('input', () => { intvOut.textContent = (intv.value / 1000).toFixed(1) + ' s'; });
  rate.addEventListener('input', () => { rateOut.textContent = parseFloat(rate.value).toFixed(2) + '×'; });

  let timer = null, running = false, lastDigit = -1;

  function pickDigit() {
    const arr = [...active];
    if (arr.length === 0) return null;
    if (arr.length === 1) return arr[0];
    let d;
    do { d = arr[Math.floor(Math.random() * arr.length)]; } while (d === lastDigit);
    lastDigit = d;
    return d;
  }

  function speak(d) {
    if (!audioOn.checked || !('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(words[d]);
    u.lang = 'de-DE';
    u.rate = parseFloat(rate.value);
    speechSynthesis.speak(u);
  }

  function nextDigit() {
    const d = pickDigit();
    if (d === null) { display.textContent = '–'; return; }
    display.textContent = d;
    speak(d);
  }

  function start() {
    running = true;
    toggleBtn.textContent = 'Stopp';
    nextDigit();
    timer = setInterval(nextDigit, parseInt(intv.value));
  }
  function stop() {
    running = false;
    toggleBtn.textContent = 'Start';
    clearInterval(timer);
    if ('speechSynthesis' in window) speechSynthesis.cancel();
  }

  toggleBtn.onclick = () => running ? stop() : start();
  stepBtn.onclick = () => nextDigit();

  intv.addEventListener('change', () => {
    if (running) { clearInterval(timer); timer = setInterval(nextDigit, parseInt(intv.value)); }
  });

  // Leertaste = Start/Stop
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
      e.preventDefault();
      running ? stop() : start();
    }
  });
</script>
</body>
</html>
